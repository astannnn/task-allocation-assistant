{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h1>Register</h1>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register" class="form-card">
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <input type="hidden" name="role" value="team_member">

        <div class="info-box">
            Public registration creates a Team Member account.
            Manager accounts are created administratively.
        </div>

        <button type="submit">Register as Team Member</button>
    </form>

    <p>
        Already have an account?
        <a href="/login">Login here</a>
    </p>
</div>
{% endblock %}
